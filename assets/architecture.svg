<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="DriftScope architecture diagram">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="460" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="600" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">Architecture</text>
  <text x="600" y="74" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">data → physics → trajectories → product</text>

  <!-- Stage 1: Data sources -->
  <g>
    <rect x="40" y="120" width="220" height="240" rx="14" fill="url(#card)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="40" y="120" width="220" height="4" rx="2" fill="url(#accent1)"/>
    <text x="60" y="155" font-family="system-ui" font-size="11" font-weight="600" fill="#0ea5e9" letter-spacing="1">DATA SOURCES</text>

    <g font-family="system-ui" font-size="13" fill="#e2e8f0">
      <text x="60" y="195" font-weight="600">CMEMS</text>
      <text x="60" y="213" font-size="11" fill="#94a3b8">Surface currents · 1/12° · daily</text>

      <text x="60" y="245" font-weight="600">ERA5</text>
      <text x="60" y="263" font-size="11" fill="#94a3b8">Waves &amp; wind · 0.25° · hourly</text>

      <text x="60" y="295" font-weight="600" fill="#64748b">+ TPXO tides</text>
      <text x="60" y="313" font-size="11" fill="#475569">soon</text>

      <text x="60" y="340" font-weight="600" fill="#64748b">+ GOFLOW SST currents</text>
    </g>
  </g>

  <!-- Stage 2: Physics engine -->
  <g>
    <rect x="320" y="120" width="240" height="240" rx="14" fill="url(#card)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="320" y="120" width="240" height="4" rx="2" fill="url(#accent2)"/>
    <text x="340" y="155" font-family="system-ui" font-size="11" font-weight="600" fill="#10b981" letter-spacing="1">PHYSICS · OCEANPARCELS</text>

    <text x="340" y="190" font-family="system-ui" font-size="13" font-weight="600" fill="#e2e8f0">Composable kernels</text>

    <g font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">
      <rect x="340" y="205" width="200" height="22" rx="4" fill="#0c1e3e"/>
      <text x="350" y="220">+ AdvectionRK4</text>
      <rect x="340" y="232" width="200" height="22" rx="4" fill="#0c1e3e"/>
      <text x="350" y="247">+ StokesDrift</text>
      <rect x="340" y="259" width="200" height="22" rx="4" fill="#0c1e3e" stroke="#1e293b"/>
      <text x="350" y="274" fill="#64748b">+ Windage</text>
      <rect x="340" y="286" width="200" height="22" rx="4" fill="#0c1e3e" stroke="#1e293b"/>
      <text x="350" y="301" fill="#64748b">+ Tides</text>
      <rect x="340" y="313" width="200" height="22" rx="4" fill="#0c1e3e" stroke="#1e293b"/>
      <text x="350" y="328" fill="#64748b">+ Settling</text>
    </g>
  </g>

  <!-- Stage 3: Output -->
  <g>
    <rect x="620" y="120" width="220" height="240" rx="14" fill="url(#card)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="620" y="120" width="220" height="4" rx="2" fill="url(#accent3)"/>
    <text x="640" y="155" font-family="system-ui" font-size="11" font-weight="600" fill="#a855f7" letter-spacing="1">TRAJECTORIES</text>

    <g font-family="system-ui" font-size="13" fill="#e2e8f0">
      <text x="640" y="195" font-weight="600">Zarr / NetCDF</text>
      <text x="640" y="213" font-size="11" fill="#94a3b8">chunked · cloud-ready</text>

      <text x="640" y="245" font-weight="600">N particles × T steps</text>
      <text x="640" y="263" font-size="11" fill="#94a3b8">lon, lat, time, depth</text>

      <text x="640" y="295" font-weight="600">xarray native</text>
      <text x="640" y="313" font-size="11" fill="#94a3b8">analyze in any notebook</text>
    </g>
  </g>

  <!-- Stage 4: Product -->
  <g>
    <rect x="900" y="120" width="260" height="240" rx="14" fill="url(#card)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="900" y="120" width="260" height="4" rx="2" fill="url(#accent4)"/>
    <text x="920" y="155" font-family="system-ui" font-size="11" font-weight="600" fill="#f59e0b" letter-spacing="1">DASHBOARD</text>

    <g font-family="system-ui" font-size="13" fill="#e2e8f0">
      <text x="920" y="195" font-weight="600"><tspan fill="#3b82f6">◐</tspan>  Drift</text>
      <text x="920" y="213" font-size="11" fill="#94a3b8">Animated trails on dark map</text>

      <text x="920" y="245" font-weight="600"><tspan fill="#ef4444">▲</tspan>  Accumulation</text>
      <text x="920" y="263" font-size="11" fill="#94a3b8">Heatmap of where stuff ends up</text>

      <text x="920" y="295" font-weight="600"><tspan fill="#06b6d4">≋</tspan>  Currents</text>
      <text x="920" y="313" font-size="11" fill="#94a3b8">Underlying field + vectors</text>

      <text x="920" y="343" font-size="11" fill="#64748b">Streamlit · pydeck · plotly</text>
    </g>
  </g>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="262" y1="240" x2="316" y2="240" marker-end="url(#arrow)"/>
    <line x1="562" y1="240" x2="616" y2="240" marker-end="url(#arrow)"/>
    <line x1="842" y1="240" x2="896" y2="240" marker-end="url(#arrow)"/>
  </g>

  <!-- Footer label -->
  <text x="600" y="420" font-family="system-ui" font-size="12" fill="#475569" text-anchor="middle">
    each stage is independently swappable · add a kernel, not a rewrite
  </text>
</svg>
